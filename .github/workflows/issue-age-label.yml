on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 00:00 运行一次
  workflow_dispatch: {} # 手动触发

permissions:
  issues: write

jobs:
  label-issues-by-age:
    runs-on: ubuntu-latest
    steps:
      - name: Add age labels to issues
        uses: actions/github-script@v6
        with:
          script: |
            const { owner, repo } = context.repo;
            const labels = {
              day60: '60天前',
              day180: '半年前',
              day365: '一年前'
            };

            // 确保这些 label 存在（不存在就创建）
            for (const name of Object.values(labels)) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status === 404) {
                  console.log(`Label "${name}" not found, creating...`);
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name,
                    color: 'ededed',
                    description: '自动根据 issue 年龄打的标签'
                  });
                } else {
                  throw e;
                }
              }
            }

            // 列出所有 open issues（含分页）
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'open', per_page: 100 }
            );

            const now = new Date();
            for (const issue of issues) {
              // 跳过 PR（issues API 会返回 PR）
              if (issue.pull_request) continue;

              const created = new Date(issue.created_at);
              const ageDays = Math.floor((now - created) / (1000 * 60 * 60 * 24));
              let targetLabel = null;
              if (ageDays >= 365) targetLabel = labels.day365;
              else if (ageDays >= 180) targetLabel = labels.day180;
              else if (ageDays >= 60) targetLabel = labels.day60;

              const currentLabelNames = (issue.labels || []).map(l => l.name);

              // 要添加的 label
              if (targetLabel) {
                if (!currentLabelNames.includes(targetLabel)) {
                  console.log(`Adding "${targetLabel}" to #${issue.number} (age ${ageDays}d)`);
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: issue.number,
                    labels: [targetLabel]
                  });
                }
              }

              // 移除不应存在的年龄标签（保持只有一个年龄标签）
              const unwanted = Object.values(labels).filter(l => l !== targetLabel && currentLabelNames.includes(l));
              for (const name of unwanted) {
                console.log(`Removing "${name}" from #${issue.number}`);
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issue.number,
                    name
                  });
                } catch (e) {
                  // removeLabel 会在 label 不存在时 404，忽略即可
                  if (e.status !== 404) throw e;
                }
              }
            }

            console.log('Done.');
