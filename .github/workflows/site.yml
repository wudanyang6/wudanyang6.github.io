name: Build Site

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  issues: read
  contents: write
  pages: write
  id-token: write

# 同一时间只跑一次部署，后来的取消前面的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: Fetch traffic data
        # 失败不阻塞建站（traffic 页显示旧数据），但 continue-on-error + error annotation
        # 让失败在 run summary 上显眼，而不是埋在日志里
        continue-on-error: true
        env:
          # traffic API 只认用户级 PAT，GITHUB_TOKEN 恒 403，不做回退
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          python3 .github/scripts/fetch_traffic.py \
            || {
              echo "### ⚠️ Traffic fetch failed — statistics page is stale" >> "$GITHUB_STEP_SUMMARY"
              echo "TRAFFIC_TOKEN secret is missing, expired, or lacks repo scope. GITHUB_TOKEN cannot access the traffic API." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }

      - name: Generate Hugo content from open issues
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: |
          pip3 install pyyaml
          python3 .github/scripts/generate_content.py

      - name: Build with Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: false

      - run: hugo --source site --destination public

      - name: Commit traffic history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic/
          if git diff --cached --quiet; then
            echo "no traffic change to commit"
          else
            git commit -m "chore: update traffic history [skip ci]"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
