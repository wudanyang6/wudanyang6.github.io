{{- /* 首屏防闪烁：必须在 <head> 里同步执行（先于样式表）。
       三态模型：data-mode 是用户选择（auto/light/dark），data-theme 是实际渲染值。
       默认 auto：跟随系统，且不写 localStorage。 */ -}}
<script>
(() => {
  const root = document.documentElement;
  const KEY = 'theme-mode';
  let mode = 'auto';
  try {
    const stored = localStorage.getItem(KEY);
    if (stored === 'light' || stored === 'dark' || stored === 'auto') mode = stored;
  } catch (e) {
    /* 隐私模式 / 禁用存储：忽略，走默认 auto */
  }
  const light = mode === 'light' ||
    (mode === 'auto' && matchMedia('(prefers-color-scheme: light)').matches);
  // 两个属性都必须在 try 之外落上：即使 localStorage 抛错也要正确渲染
  root.setAttribute('data-mode', mode);
  root.setAttribute('data-theme', light ? 'light' : 'dark');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', light ? '#f5f7fc' : '#0b1020');
})();
</script>
