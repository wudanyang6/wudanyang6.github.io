<button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换深浅色主题" aria-pressed="false">
  <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4.2" />
    <path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3 17 7M7 17l-1.7 1.7" />
  </svg>
  <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M20.4 14.2A8.6 8.6 0 1 1 9.8 3.6a7 7 0 0 0 10.6 10.6Z" />
  </svg>
</button>
<script>
(() => {
  const btn = document.getElementById('theme-toggle');
  if (!btn) return;
  const root = document.documentElement;
  const KEY = 'theme';
  const isLight = () => root.getAttribute('data-theme') === 'light';
  const syncPressed = () => btn.setAttribute('aria-pressed', String(isLight()));
  syncPressed();
  btn.addEventListener('click', () => {
    const next = isLight() ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    root.setAttribute('data-explicit', '1');
    try {
      localStorage.setItem(KEY, next);
    } catch (e) {
      /* 存储不可用：本次会话内切换仍然生效 */
    }
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', next === 'light' ? '#f5f7fc' : '#0b1020');
    syncPressed();
  });
})();
</script>
